<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProofCraft</title>
<meta name="description" content="ProofCraft is a free workspace where college students plan their semester, study for exams, work on projects with their group and turn finished work into a CV.">
<meta name="theme-color" content="#FAF8F3">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Readex+Pro:wght@300..700&display=swap">
<script>
/* Apply saved theme and language before first paint so nothing flashes. */
(function(){document.documentElement.classList.add('js');try{var p=JSON.parse(localStorage.getItem('pc:prefs')||'null'),d=p&&p.d||{};
var theme=d.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
document.documentElement.dataset.theme=theme;
if(d.lang==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl'}}catch(e){}})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
