<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProofCraft</title>
<meta name="description" content="ProofCraft is a free workspace to plan study, manage projects and turn finished work into a strong CV and job application.">
<meta name="theme-color" content="#FAF8F3">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="index,follow">
<meta property="og:title" content="ProofCraft — turn your work into proof">
<meta property="og:description" content="Plan study, manage projects and build a stronger application in one bilingual workspace.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://proofcraft.online/">
<link rel="canonical" href="https://proofcraft.online/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
/* Apply saved theme and language before first paint so nothing flashes. */
(function(){document.documentElement.classList.add('js');try{var p=JSON.parse(localStorage.getItem('pc:prefs')||'null'),d=p&&p.d||{};
var theme=d.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
document.documentElement.dataset.theme=theme;
if(d.lang==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl'}}catch(e){}})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
